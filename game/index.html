<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Drift — a slingshot puzzle in deep space</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070f; height: 100%; overflow: hidden; }

    touch-action: none;
  }
</style>

<canvas id="game" width="1280" height="720"></canvas>
